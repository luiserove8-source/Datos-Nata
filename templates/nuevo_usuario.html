{% extends "base.html" %}
{% block title %}Nuevo Usuario – Gestión de Actas{% endblock %}
{% block content %}

<div class="page-header">
    <h1>Crear Nuevo Usuario</h1>
    <a href="{{ url_for('lista_usuarios') }}" class="btn btn-outline">&#8592; Volver</a>
</div>

<div class="card" style="max-width:480px;">
    <form method="post">
        <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required
                   value="{{ request.form.get('nombre', '') }}"
                   placeholder="Ej: María García">
        </div>
        <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <input type="text" id="username" name="username" required
                   value="{{ request.form.get('username', '') }}"
                   placeholder="Ej: mgarcia" autocomplete="off">
            <div class="form-hint">Solo letras, números y guiones. Sin espacios.</div>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required
                   placeholder="Mínimo 4 caracteres" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="rol">Rol</label>
            <select id="rol" name="rol">
                <option value="usuario" {% if request.form.get('rol','usuario')=='usuario' %}selected{% endif %}>Usuario</option>
                <option value="admin" {% if request.form.get('rol')=='admin' %}selected{% endif %}>Administrador</option>
            </select>
            <div class="form-hint">Los administradores pueden gestionar usuarios y ver toda la actividad.</div>
        </div>
        <div style="display:flex; gap:.75rem;">
            <button type="submit" class="btn btn-primary">Crear Usuario</button>
            <a href="{{ url_for('lista_usuarios') }}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>

{% endblock %}
